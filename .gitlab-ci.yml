stages:
  - mirror

mirror-to-github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    - cd repo.git
    - git push --mirror "https://${GITHUB_PAT}@github.com/U-Night/pixel-war.git"
  rules:
    - when: always
