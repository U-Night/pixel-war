stages:
  - mirror

mirror_github:
  stage: mirror
  image: alpine:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git git-lfs
    - git lfs install --skip-smudge
  script:
    - |
      if [ -z "$GITHUB_PAT" ]; then
        echo "⚠️  GITHUB_PAT not set, skipping mirror"
        exit 0
      fi

      # Fetch all branches and tags as local refs
      git fetch origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*' 2>/dev/null || true

      # Add GitHub remote
      git remote add github "https://${GITHUB_PAT}@github.com/U-Night/pixel-war.git"

      # Push all branches + tags
      echo "Mirroring branches to GitHub…"
      git push github --all --force
      echo "Mirroring tags to GitHub…"
      git push github --tags --force
      echo "✅ Mirror push complete"